<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ZOMBIE DERBY : 異能survivors</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game-container">
    <!-- 🏠 タイトル画面 -->
    <div id="title-screen">
      <div class="title-logo-wrapper">
        <img src="/zombielogo.webp" alt="ZOMBIE DERBY 異能survivors" class="title-logo-img" />
      </div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <button id="nav-scout-btn" class="retro-btn"><span>探索 (スカウト)</span></button>
        <button id="nav-garage-btn" class="retro-btn"><span>牧場 (ガレージ)</span></button>
      </div>
    </div>

    <!-- 🔦 スカウト画面 -->
    <div id="scout-screen" class="hidden">
      <div class="screen-title">検体スカウト</div>
      <div class="scout-form">
        <div class="form-group">
          <label>探索エリア (特化パラメータ)</label>
          <select id="scout-city">
            <option value="tokyo">東京 (バランス)</option>
            <option value="osaka">大阪 (気性荒め)</option>
            <option value="nagoya">名古屋 (パワー特化)</option>
            <option value="fukuoka">福岡 (スピード特化)</option>
            <option value="sapporo">札幌 (スタミナ特化)</option>
          </select>
        </div>
        <div class="form-group">
          <label>希望の脚質</label>
          <select id="scout-style">
            <option value="逃げ">逃げ (序盤型)</option>
            <option value="先行">先行 (中盤型)</option>
            <option value="差し">差し (後半型)</option>
            <option value="追込">追込 (終盤特化)</option>
          </select>
        </div>
        <div class="form-group">
          <label>検体名 (命名)</label>
          <input type="text" id="scout-name" value="名無しゾンビ" maxlength="10">
        </div>
        <button id="do-scout-btn" class="retro-btn" style="margin-top: 20px;"><span>探索開始</span></button>
        <button id="back-to-title-1" class="retro-btn-small" style="margin-top: 10px;">戻る</button>
      </div>
    </div>

    <!-- 🧟 牧場（ガレージ）画面 -->
    <div id="garage-screen" class="hidden">
      <div class="screen-title">保有検体 (<span id="garage-count">0</span>/3)</div>
      <div id="garage-list" class="garage-list">
        <!-- JSでゾンビリストが生成されます -->
      </div>
      <button id="back-to-title-2" class="retro-btn-small" style="margin-top: 20px;">タイトルへ</button>
    </div>

    <!-- 🏙️ レース出走：都市選択画面 -->
    <div id="city-select-screen" class="hidden">
      <div class="screen-title">遠征先を選択</div>
      <div id="city-list" class="city-container"></div>
      <button id="back-to-garage-1" class="retro-btn-small" style="margin-top: 20px;">牧場へ戻る</button>
    </div>

    <!-- 🧪 育成画面 -->
    <div id="nurture-screen" class="hidden">
      <div class="nurture-header">
        <span class="nurture-turn" id="nurture-turn-txt">残 5 調整</span>
        <span class="nurture-name" id="nurture-zombie-name">検体 No.101</span>
      </div>
      <div class="zombie-preview-box">
        <canvas id="zombieCanvas" width="120" height="120"></canvas>
      </div>
      <div class="status-box">
        <div class="stat-row"><span>脚質（戦法）</span><span id="stat-style" style="color:#facc15;">先行</span></div>
        <div class="stat-row"><span>速さ</span><span id="stat-spd">50</span></div>
        <div class="stat-row"><span>力強さ</span><span id="stat-pow">50</span></div>
        <div class="stat-row"><span>体力</span><span id="stat-stm">50</span></div>
        <div class="stat-row"><span>気性（ムラ）</span><span id="stat-mnt">50</span></div>
        <div class="stat-row"><span>異能（スキル力）</span><span id="stat-mag">50</span></div>
      </div>
      <div class="command-container">
        <button class="cmd-btn" data-cmd="spd"><span class="cmd-icon">⚡</span><span class="cmd-text">神経投与（速さ↑ / 気性↓）</span></button>
        <button class="cmd-btn" data-cmd="pow"><span class="cmd-icon">💥</span><span class="cmd-text">筋組織拡張（力強さ↑ / 異能↓）</span></button>
        <button class="cmd-btn" data-cmd="stm"><span class="cmd-icon">🧪</span><span class="cmd-text">防腐処理（体力↑ / 速さ↓）</span></button>
      </div>
      <button id="back-to-garage-2" class="retro-btn-small" style="margin-top: 10px;">牧場へ戻る</button>

      <!-- 育成ドラムロール演出 -->
      <div id="nurture-result-overlay" class="hidden">
        <div id="drumroll-text" class="drumroll-text">調整中...</div>
        <div id="result-label" class="result-label hidden">成功</div>
        <div id="result-status-changes" class="result-status-changes hidden"></div>
      </div>
    </div>

    <!-- ⚡ カットイン画面 -->
    <div id="cutin-screen" class="hidden">
      <div class="cutin-bg"></div>
      <div class="cutin-content">
        <div id="cutin-en" class="cutin-en">TOKYO</div>
        <div id="cutin-ja" class="cutin-ja">東京</div>
      </div>
    </div>

    <!-- 🏁 レース画面 -->
    <div id="race-screen" class="hidden">
      <div id="progress-bar-container">
        <div class="progress-start">S</div>
        <div class="progress-track">
          <div id="runner-marker-0" class="runner-marker p-you"></div>
          <div id="runner-marker-1" class="runner-marker p-r1"></div>
          <div id="runner-marker-2" class="runner-marker p-r2"></div>
          <div id="runner-marker-3" class="runner-marker p-r3"></div>
        </div>
        <div class="progress-goal">G</div>
      </div>

      <div id="race-hud">
        <div class="hud-item"><span class="hud-label">順位</span><span id="hud-rank" class="hud-val">1位 / 4人</span></div>
        <div class="hud-item"><span class="hud-label">残り</span><span id="hud-dist" class="hud-val">1000m</span></div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        <div id="countdown-overlay" class="hidden">5</div>
        <!-- 🐸 カエルスキルの「視界ジャックスライム」演出 -->
        <div id="slime-overlay" class="hidden"></div>
      </div>
      
      <div id="flask-container">
        <div class="flask-card" data-index="0">
          <div class="flask-wrapper"><div class="flask-fill" id="flask-fill-0"></div><div class="flask-icon" id="flask-icon-0">🧪</div></div>
          <span class="flask-name" id="flask-name-0">スキル1</span><span class="flask-percent" id="flask-percent-0">0%</span>
        </div>
        <div class="flask-card" data-index="1">
          <div class="flask-wrapper"><div class="flask-fill" id="flask-fill-1"></div><div class="flask-icon" id="flask-icon-1">⚡</div></div>
          <span class="flask-name" id="flask-name-1">スキル2</span><span class="flask-percent" id="flask-percent-1">0%</span>
        </div>
        <div class="flask-card" data-index="2">
          <div class="flask-wrapper"><div class="flask-fill" id="flask-fill-2"></div><div class="flask-icon" id="flask-icon-2">🛡️</div></div>
          <span class="flask-name" id="flask-name-2">スキル3</span><span class="flask-percent" id="flask-percent-2">0%</span>
        </div>
      </div>
    </div>

    <!-- 🏆 リザルト画面 -->
    <div id="result-screen" class="hidden">
      <div class="result-title">RACE RESULT</div>
      <div id="result-rank-badge" class="rank-badge">1位</div>
      <div id="result-detail" class="result-detail">走破タイム: 00:00</div>
      <button id="retry-btn" class="retro-btn">
        <span>牧場へ戻る</span>
      </button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
