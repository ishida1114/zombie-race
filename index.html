<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ZOMBIE DERBY : 異能survivors</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game-container">
    <!-- 🧟 タイトル画面 -->
    <div id="title-screen">
      <div class="title-logo-wrapper">
        <div class="title-sub">昭和都心 狂走劇</div>
        <img src="/zombielogo.webp" alt="ZOMBIE DERBY 異能survivors" class="title-logo-img" />
      </div>

      <button id="start-btn" class="retro-btn">
        <span>レース開始</span>
      </button>
    </div>

    <!-- 🏁 レース画面 -->
    <div id="race-screen" class="hidden">
      <!-- レースHUD -->
      <div id="race-hud">
        <div class="hud-item"><span class="hud-label">順位</span><span id="hud-rank" class="hud-val">1位</span></div>
        <div class="hud-item"><span class="hud-label">残り</span><span id="hud-dist" class="hud-val">1000m</span></div>
      </div>

      <canvas id="gameCanvas" width="360" height="460"></canvas>
      
      <!-- フラスコUI（ここだけ怪しく発光） -->
      <div id="flask-container">
        <div class="flask-card" data-index="0">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-0"></div>
            <div class="flask-icon" id="flask-icon-0">☄️</div>
          </div>
          <span class="flask-name" id="flask-name-0">スキル1</span>
          <span class="flask-percent" id="flask-percent-0">0%</span>
        </div>

        <div class="flask-card" data-index="1">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-1"></div>
            <div class="flask-icon" id="flask-icon-1">⚡</div>
          </div>
          <span class="flask-name" id="flask-name-1">スキル2</span>
          <span class="flask-percent" id="flask-percent-1">0%</span>
        </div>

        <div class="flask-card" data-index="2">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-2"></div>
            <div class="flask-icon" id="flask-icon-2">🛡️</div>
          </div>
          <span class="flask-name" id="flask-name-2">スキル3</span>
          <span class="flask-percent" id="flask-percent-2">0%</span>
        </div>
      </div>
    </div>

    <!-- 🏆 リザルト画面 -->
    <div id="result-screen" class="hidden">
      <div class="result-title">試合結果</div>
      <div id="result-rank-badge" class="rank-badge">1位</div>
      <div id="result-detail" class="result-detail">タイム: 00:00</div>

      <button id="retry-btn" class="retro-btn">
        <span>タイトルへ</span>
      </button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
