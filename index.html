<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ZOMBIE DERBY : 異能survivors</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game-container">
    <!-- 1. タイトル画面 -->
    <div id="title-screen">
      <div class="title-logo-wrapper">
        <img src="/zombielogo.webp" alt="ZOMBIE DERBY 異能survivors" class="title-logo-img" />
      </div>

      <button id="start-btn" class="retro-btn">
        <span>START</span>
      </button>
    </div>

    <!-- 2. 育成画面 -->
    <div id="nurture-screen" class="hidden">
      <div class="nurture-header">
        <span class="nurture-turn" id="nurture-turn-txt">残 5 調整</span>
        <span class="nurture-name" id="nurture-zombie-name">検体 No.101</span>
      </div>

      <div class="zombie-preview-box">
        <canvas id="zombieCanvas" width="120" height="120"></canvas>
      </div>

      <div class="status-box">
        <div class="stat-row"><span>脚力（スピード）</span><span id="stat-spd">50</span></div>
        <div class="stat-row"><span>筋力（パワー/防御）</span><span id="stat-pow">50</span></div>
        <div class="stat-row"><span>持久（スタミナ）</span><span id="stat-stm">50</span></div>
      </div>

      <div class="command-container">
        <button class="cmd-btn" data-cmd="spd">
          <span class="cmd-icon">⚡</span>
          <span class="cmd-text">神経投与（脚力強化）</span>
        </button>
        <button class="cmd-btn" data-cmd="pow">
          <span class="cmd-icon">💥</span>
          <span class="cmd-text">筋組織拡張（パワー/防御）</span>
        </button>
        <button class="cmd-btn" data-cmd="stm">
          <span class="cmd-icon">🧪</span>
          <span class="cmd-text">防腐処理（持久強化）</span>
        </button>
      </div>

      <button id="to-race-btn" class="retro-btn hidden">
        <span>出走準備完了</span>
      </button>
    </div>

    <!-- 3. レース画面 -->
    <div id="race-screen" class="hidden">
      <!-- 横進捗バー -->
      <div id="progress-bar-container">
        <div class="progress-start">S</div>
        <div class="progress-track">
          <div id="runner-marker-0" class="runner-marker p-you"></div>
          <div id="runner-marker-1" class="runner-marker p-r1"></div>
          <div id="runner-marker-2" class="runner-marker p-r2"></div>
          <div id="runner-marker-3" class="runner-marker p-r3"></div>
        </div>
        <div class="progress-goal">G</div>
      </div>

      <!-- レースHUD -->
      <div id="race-hud">
        <div class="hud-item"><span class="hud-label">順位</span><span id="hud-rank" class="hud-val">1位 / 4人</span></div>
        <div class="hud-item"><span class="hud-label">残り</span><span id="hud-dist" class="hud-val">1000m</span></div>
      </div>

      <!-- ゲーム描画Canvas -->
      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        <!-- ラスト5秒カウントダウン表示 -->
        <div id="countdown-overlay" class="hidden">5</div>
      </div>
      
      <!-- フラスコUI -->
      <div id="flask-container">
        <div class="flask-card" data-index="0">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-0"></div>
            <div class="flask-icon" id="flask-icon-0">🧪</div>
          </div>
          <span class="flask-name" id="flask-name-0">スキル1</span>
          <span class="flask-desc" id="flask-desc-0">効果</span>
          <span class="flask-percent" id="flask-percent-0">0%</span>
        </div>

        <div class="flask-card" data-index="1">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-1"></div>
            <div class="flask-icon" id="flask-icon-1">⚡</div>
          </div>
          <span class="flask-name" id="flask-name-1">スキル2</span>
          <span class="flask-desc" id="flask-desc-1">効果</span>
          <span class="flask-percent" id="flask-percent-1">0%</span>
        </div>

        <div class="flask-card" data-index="2">
          <div class="flask-wrapper">
            <div class="flask-fill" id="flask-fill-2"></div>
            <div class="flask-icon" id="flask-icon-2">🛡️</div>
          </div>
          <span class="flask-name" id="flask-name-2">スキル3</span>
          <span class="flask-desc" id="flask-desc-2">効果</span>
          <span class="flask-percent" id="flask-percent-2">0%</span>
        </div>
      </div>
    </div>

    <!-- 4. リザルト画面 -->
    <div id="result-screen" class="hidden">
      <div class="result-title">RACE RESULT</div>
      <div id="result-rank-badge" class="rank-badge">1位</div>
      <div id="result-detail" class="result-detail">走破タイム: 00:00</div>

      <button id="retry-btn" class="retro-btn">
        <span>タイトルへ</span>
      </button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
